databases:
  - name: hiit-learning-hub-db
    databaseName: hiit_learning_hub
    user: hiit_learning_hub
    plan: free

services:
  - type: web
    name: hiit-learning-hub
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn rest.wsgi:application
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: hiit-learning-hub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: hiit-learning-hub.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://hiit-learning-hub.onrender.com
